name: Build Meeqat apps (TV, Admin, Super)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEEQAT_SERVER: ${{ vars.MEEQAT_SERVER || 'https://meeqat.winocle.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APKs
        run: gradle -p android assembleTvRelease assembleAdminRelease assembleSuperadminRelease --no-daemon --stacktrace

      - name: Publish APKs (TV + Admin public, Super private)
        run: |
          OUT=android/app/build/outputs/apk
          mkdir -p public/downloads private
          cp $OUT/tv/release/app-tv-release.apk               public/downloads/meeqat-tv.apk
          cp $OUT/admin/release/app-admin-release.apk         public/downloads/meeqat-admin.apk
          cp $OUT/superadmin/release/app-superadmin-release.apk private/meeqat-super.apk
          V="1.0.$GITHUB_RUN_NUMBER"; N=$GITHUB_RUN_NUMBER
          S_TV=$(stat -c%s public/downloads/meeqat-tv.apk); S_AD=$(stat -c%s public/downloads/meeqat-admin.apk); S_SU=$(stat -c%s private/meeqat-super.apk)
          cat > public/downloads/app.json <<JSON
          {"version":"$V","versionCode":$N,"size":$S_TV,"server":"$MEEQAT_SERVER","built":"$(date -u +%FT%TZ)",
           "apps":{"tv":{"version":"$V","versionCode":$N,"size":$S_TV},
                   "admin":{"version":"$V","versionCode":$N,"size":$S_AD},
                   "super":{"version":"$V","versionCode":$N,"size":$S_SU}}}
          JSON
          cat public/downloads/app.json

      - uses: actions/upload-artifact@v4
        with:
          name: meeqat-apks
          path: |
            public/downloads/*.apk
            private/meeqat-super.apk

      - name: Commit APKs
        run: |
          git config user.name  "meeqat-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/downloads private
          git commit -m "Meeqat apps build ${GITHUB_RUN_NUMBER}" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
