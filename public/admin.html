<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meeqat · Control</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Outfit;font-weight:400;font-display:swap;src:url(fonts/outfit-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:500;font-display:swap;src:url(fonts/outfit-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:600;font-display:swap;src:url(fonts/outfit-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Amiri;font-weight:400;font-display:swap;src:url(fonts/amiri-arabic-400-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Malayalam';font-weight:400;font-display:swap;src:url(fonts/noto-sans-malayalam-malayalam-400-normal.woff2) format('woff2')}
:root{--acc:#f3c96b;--ink:#1b1306;--bg:#070b1d;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.11);--line:rgba(255,255,255,.12);--mut:rgba(255,255,255,.62);--dim:rgba(255,255,255,.4);--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Outfit,'Noto Sans Malayalam',Amiri,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px}
body{background:radial-gradient(120% 60% at 100% 0%,#2a1b5c 0%,transparent 60%),radial-gradient(100% 60% at 0% 100%,#0c3a4a 0%,transparent 60%),var(--bg);background-attachment:fixed;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.ar{font-family:Amiri,serif;direction:rtl}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:20px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header.app{position:sticky;top:0;z-index:20;padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;background:rgba(7,11,29,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(243,201,107,.14);flex:none}
.logo svg{width:22px;height:22px;fill:var(--acc)}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{color:var(--mut);font-size:12.5px}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);padding:7px 12px;border-radius:999px;background:var(--card);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--warn)}.sync.bad i{background:var(--bad)}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:26px 6px 10px}
.card{padding:6px 16px;margin-bottom:12px}
.card.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div:first-child{flex:1;min-width:0}
.row b{font-weight:500;display:block}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px;line-height:1.35}
.field{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=month],input[type=password],input[type=tel],select,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select option{background:#111830}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* toggle */
.tog input{display:none}
.tog i{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);flex:none;transition:.2s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tog input:checked+i{background:var(--acc)}
.tog input:checked+i::after{left:23px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 16px;font-weight:500;cursor:pointer;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn.bad{color:#fecaca;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
.btn.sm{min-height:36px;padding:7px 12px;border-radius:11px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:22px;cursor:pointer}
.step input{width:72px;text-align:center}
.iq{padding:16px;margin-bottom:12px}
.iqh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.iqh b{font-size:20px;font-weight:600}
.iqh .ar{color:var(--acc);font-size:20px;margin-left:8px}
.iqh small{color:var(--mut)}
.iqres{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.iqres span{color:var(--mut);font-size:14px}
.iqres b{font-size:26px;color:var(--acc);font-weight:600}
.today{width:100%;border-collapse:collapse}
.today td,.today th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line)}
.today th{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.today tr:last-child td{border-bottom:0}
.today td.t{font-size:18px;font-weight:500}
.today td.q{color:var(--acc);font-size:18px;font-weight:500}
.today tr.nx td{color:var(--acc)}
.today tr.nx td:first-child::before{content:"● ";font-size:10px;vertical-align:middle}
.list-item{padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.li-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
.li-actions .grow{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(7,11,29,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:110px;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--dim);padding:6px 0;cursor:pointer}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}
.banner{padding:13px 15px;border-radius:14px;margin-bottom:12px;font-size:14px;line-height:1.4;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fde68a}
.chipx{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.chipx.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.secs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.secs>span{font-size:13px;color:var(--mut);margin-right:2px}
.tvrow{padding:12px 0;border-bottom:1px solid var(--line)}
.tvrow:last-child{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);margin-right:6px}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:560px;background:#10162e;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.banner.info{background:rgba(124,200,255,.1);border-color:rgba(124,200,255,.3);color:#cfe8ff}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:12px 18px;border-radius:14px;font-weight:500;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:400px;padding:28px}
.login h1{font-size:28px;margin:18px 0 4px;font-weight:600}
.login p{color:var(--mut);margin:0 0 20px;line-height:1.45}
.pinput{letter-spacing:.5em;text-align:center;font-size:24px!important}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:180px;margin:12px auto}
.qrbox svg{display:block;width:100%}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;color:var(--mut)}
.tt{width:100%;border-collapse:collapse;font-size:13px}
.tt th,.tt td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
.tt th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tt tr.fri td{color:var(--acc)}
.tt tr.td td{background:rgba(243,201,107,.12)}
.hide{display:none!important}
.muted{color:var(--mut);font-size:14px;line-height:1.45}
@media print{body{background:#fff;color:#000;padding:0}header.app,.tabs,.noprint{display:none!important}.glass{background:none;border:0}.tt th,.tt td{border-color:#ccc;color:#000!important}.wrap{max-width:none}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="loginView" class="login hide">
  <div class="box glass">
    <div class="logo" style="width:56px;height:56px;border-radius:16px"><svg viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5Z"/></svg></div>
    <h1>Meeqat Control</h1>
    <p>Log in to control your masjid or home screen.</p>
    <div class="seg" id="lgMode" style="margin-bottom:6px"><button type="button" data-m="mobile" class="on">Mobile number</button><button type="button" data-m="id">Screen ID</button></div>
    <div class="field" id="lgMobileF"><span>Mobile number used when registering</span><div id="lgPhone"></div></div>
    <label class="field hide" id="lgIdF"><span>Screen ID</span><input type="text" id="lgId" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>PIN</span><input type="password" id="lgPin" class="pinput" inputmode="numeric" autocomplete="current-password" maxlength="12"></label>
    <div class="err" id="lgErr"></div>
    <button class="btn pri wide" id="lgGo" style="margin-top:10px">Connect</button>
    <div id="lgPick"></div>
    <button class="btn wide hide" id="lgLocal" style="margin-top:10px">Use on this device only (no server)</button>
    <div class="muted" style="margin-top:18px;text-align:center">New here? <a href="welcome.html#register" style="color:var(--acc)">Register your masjid or home</a></div>
    <div class="muted" style="margin-top:14px;text-align:center;font-size:14px" id="lgApp"></div>
    <div class="muted" style="margin-top:8px;text-align:center;font-size:13px" id="lgHelp">Forgot your PIN? Ask the Meeqat administrator to reset it.</div>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="appView" class="hide">
  <header class="app">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5Z"/></svg></div>
    <div class="htitle"><b id="hName">Masjid</b><small id="hSub"></small></div>
    <div class="sync" id="sync"><i></i><span>Ready</span></div>
  </header>
  <main class="wrap" id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Home</button>
    <button data-tab="iqamah"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Iqamah</button>
    <button data-tab="notices"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6L7 10Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Notices</button>
    <button data-tab="adhkar"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.6"/><circle cx="17.3" cy="6.7" r="1.6"/><circle cx="19.5" cy="12" r="1.6"/><circle cx="17.3" cy="17.3" r="1.6"/><circle cx="12" cy="19.5" r="1.6"/><circle cx="6.7" cy="17.3" r="1.6"/><circle cx="4.5" cy="12" r="1.6"/><circle cx="6.7" cy="6.7" r="1.6"/></svg>Adhkar</button>
    <button data-tab="features"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="5" rx="2.5"/><rect x="3" y="13" width="18" height="5" rx="2.5"/><circle cx="16.5" cy="8.5" r="1.5"/><circle cx="7.5" cy="15.5" r="1.5"/></svg>Features</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</button>
  </nav>
</section>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="audio/*" class="hide">
<input type="file" id="jsonIn" accept="application/json,.json" class="hide">

<script src="vendor/adhan.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsqr.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="places.js"></script>
<script>
(function () {
  'use strict';
  const M = Miqat, $ = (i) => document.getElementById(i), esc = M.esc;
  let ID = M.explicitScreenId() || '';
  let store = M.createAdminStore(ID);
  let S = M.withDefaults(null), NAME = '', MEDIA = {}, MODE = 'server', TAB = 'home', OWNER = {}, LGMODE = 'mobile';
  let saveTimer = null, pending = false, viewers = 0, pinIsDefault = false, retryTimer = null;

  /* ================= login ================= */
  function showLogin(msg) {
    $('appView').classList.add('hide'); $('loginView').classList.remove('hide');
    $('lgId').value = ID; $('lgErr').textContent = msg || ''; $('lgPick').innerHTML = '';
    setLgMode(ID ? 'id' : 'mobile');
    if (!M.serverAvailable()) { $('lgLocal').classList.remove('hide'); $('lgGo').classList.add('hide'); $('lgErr').textContent = 'Opened as a file — settings will be saved on this device only.'; }
    setTimeout(() => (LGMODE === 'mobile' && !$('lgMobile').value ? $('lgMobile') : $('lgPin')).focus(), 100);
  }
  async function doLogin(pin, silent) {
    const id = ($('lgId').value || ID).trim().toLowerCase();
    if (id !== ID) { ID = id; store = M.createAdminStore(ID); try { localStorage.setItem('miqat:screen', ID); } catch (e) { /* */ } }
    try {
      const j = await store.login(pin);
      try { localStorage.setItem('miqat:pin:' + ID, pin); } catch (e) { /* */ }
      MODE = 'server'; NAME = j.name; MEDIA = j.media || {}; viewers = j.viewers || 0; pinIsDefault = j.pinIsDefault; OWNER = j.owner || {};
      try { localStorage.setItem('miqat:screen', ID); } catch (e) { /* */ }
      S = M.withDefaults(j.settings);
      if (!j.settings) { NAME = NAME || 'Main screen'; }
      openApp();
    } catch (e) {
      if (e.status === 403) { showLogin(e.message); return; }
      if (e.status === 401 || e.status === 429 || e.status === 404) { try { localStorage.removeItem('miqat:pin:' + ID); } catch (x) { /* */ } showLogin(e.status === 404 ? 'Screen ID not found.' : e.message); }
      else if (silent) { offlineOpen(); }
      else { $('lgErr').textContent = 'Cannot reach the server. Check Wi-Fi. (' + e.message + ')'; offerOffline(); }
    }
  }
  function offerOffline() { $('lgLocal').textContent = M.readCache(ID) ? 'Open saved copy (offline)' : 'Use on this device only'; $('lgLocal').classList.remove('hide'); }
  function offlineOpen() {
    const c = M.readCache(ID);
    S = M.withDefaults(c && c.settings); NAME = (c && c.meta && c.meta.name) || NAME;
    MODE = MODE === 'local' || M._probe === 'no' || !M.serverAvailable() ? 'local' : 'server-offline';
    openApp(); setSync(MODE === 'local' ? 'This device only' : 'Offline — changes will sync', MODE === 'local' ? 'ok' : 'bad');
    if (MODE === 'server-offline') scheduleRetry();
  }
  function setLgMode(m) {
    LGMODE = m;
    $('lgMode').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    $('lgMobileF').classList.toggle('hide', m !== 'mobile'); $('lgIdF').classList.toggle('hide', m !== 'id');
  }
  $('lgMode').onclick = (e) => { const b = e.target.closest('button'); if (b) { setLgMode(b.dataset.m); $('lgPick').innerHTML = ''; } };
  $('lgGo').onclick = async () => {
    const p = $('lgPin').value.trim(); if (!p) return;
    $('lgErr').textContent = ''; $('lgPick').innerHTML = '';
    if (LGMODE === 'id') return doLogin(p);
    const mob = M.phoneRead($('lgPhone'));
    if (mob.replace(/\D/g, '').length < 8) { $('lgErr').textContent = 'Enter the mobile number you registered with.'; return; }
    try {
      const j = await M.post('/api/find', { mobile: mob, pin: p });
      if (j.screens.length === 1) { $('lgId').value = j.screens[0].id; return doLogin(p); }
      $('lgPick').innerHTML = '<div class="muted" style="margin:14px 0 8px">Choose a screen:</div>' + j.screens.map((x) => `<button class="btn wide" style="margin-bottom:8px;justify-content:space-between" data-pick="${esc(x.id)}"><span>${x.type === 'home' ? '🏠' : '🕌'} ${esc(x.name)}</span><small class="muted">${esc(x.city || '')}${x.disabled ? ' · disabled' : x.pending ? ' · pending' : ''}</small></button>`).join('');
    } catch (e) { $('lgErr').textContent = e.status ? e.message : 'Cannot reach the server. Check your internet.'; if (!e.status) offerOffline(); }
  };
  $('lgPick').onclick = (e) => { const b = e.target.closest('[data-pick]'); if (!b) return; $('lgId').value = b.dataset.pick; doLogin($('lgPin').value.trim()); };
  (function () {
    let iso = 'IN';
    try { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; iso = { 'Asia/Dubai': 'AE', 'Asia/Riyadh': 'SA', 'Asia/Qatar': 'QA', 'Asia/Muscat': 'OM', 'Asia/Kuwait': 'KW', 'Asia/Bahrain': 'BH', 'Asia/Karachi': 'PK', 'Asia/Dhaka': 'BD', 'Asia/Colombo': 'LK', 'Europe/London': 'GB', 'Asia/Kuala_Lumpur': 'MY', 'Asia/Singapore': 'SG' }[tz] || 'IN'; } catch (e) { /* */ }
    $('lgPhone').innerHTML = M.phoneHtml(iso, '', 'id="lgMobile"');
    $('lgMobile').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('lgPin').focus(); });
  })();

  /* ================= state + saving ================= */
  const get = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), S);
  function set(path, v) {
    const ks = path.split('.'); let o = S;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = v; changed();
  }
  function changed() {
    pending = true;
    M.writeCache(ID, Object.assign({}, M.readCache(ID) || {}, { settings: S, meta: { name: NAME } }));
    setSync('Saving…', 'busy');
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 650);
    refreshLive();
  }
  async function flush() {
    if (!pending) return;
    if (MODE === 'local') { store.saveLocal(S, NAME); pending = false; setSync('Saved on this device', 'ok'); return; }
    try {
      const r = await store.save(S, NAME, OWNER);
      pending = false; viewers = r.viewers; MODE = 'server';
      setSync(`Saved · ${r.viewers} screen${r.viewers === 1 ? '' : 's'} live`, 'ok');
    } catch (e) {
      if (e.status === 401) { showLogin('Session expired — enter PIN again.'); return; }
      MODE = 'server-offline'; setSync('Offline — will sync', 'bad'); scheduleRetry();
    }
  }
  function scheduleRetry() { clearTimeout(retryTimer); retryTimer = setTimeout(async () => { if (pending) await flush(); else { try { await store.fetch(); MODE = 'server'; setSync('Connected', 'ok'); } catch (e) { scheduleRetry(); } } }, 8000); }
  function setSync(text, cls) { const el = $('sync'); el.className = 'sync ' + (cls || ''); el.querySelector('span').textContent = text; }
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200); }
  async function cmd(type, extra) {
    if (MODE !== 'server') return toast('Needs connection to the server');
    try { const r = await store.command(type, extra); toast(r.viewers ? `Sent to ${r.viewers} screen${r.viewers > 1 ? 's' : ''}` : 'No TV connected right now'); }
    catch (e) { toast(e.message); }

  const txt = (path, label, ph, type) => `<label class="field"><span>${label}</span><input type="${type || 'text'}" data-b="${path}" value="${esc(get(path) ?? '')}" placeholder="${esc(ph || '')}"></label>`;
  const num = (path, label, step, min, max) => `<label class="field"><span>${label}</span><input type="number" inputmode="decimal" data-b="${path}" data-t="num" value="${esc(get(path) ?? '')}" step="${step || 1}" ${min != null ? `min="${min}"` : ''} ${max != null ? `max="${max}"` : ''}></label>`;
  const tim = (path, label) => `<label class="field"><span>${label}</span><input type="time" data-b="${path}" value="${esc(get(path) || '')}"></label>`;
  const sel = (path, label, opts, rr) => `<label class="field"><span>${label}</span><select data-b="${path}" ${rr ? 'data-rr="1"' : ''}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(get(path)) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  const step = (path, d) => `<div class="step"><button data-step="${path}" data-d="-${d}">−</button><input type="number" inputmode="numeric" data-b="${path}" data-t="num" value="${esc(get(path) ?? 0)}"><button data-step="${path}" data-d="${d}">+</button></div>`;

  document.addEventListener('input', onInput);

  function onInput(e) {
    const el = e.target;
    if (el.dataset && el.dataset.ak !== undefined) {
      const it = ensureAdhkar()[+el.dataset.ak]; if (!it) return;
      const f = el.dataset.f;
      it[f] = f === 'on' ? el.checked : f === 'count' ? Math.max(1, parseInt(el.value, 10) || 1) : el.value;
      changed(); return;

    if (el.dataset && el.dataset.ph && el.closest('[data-phone-owner]')) { OWNER.mobile = M.phoneRead(el.closest('[data-phone-owner]')); changed(); return; }
    if (el.dataset && el.dataset.owner) { if (e.type === 'change' || el.tagName !== 'SELECT') { OWNER[el.dataset.owner] = el.value; changed(); } return; }
    const b = el.dataset && el.dataset.b;
    if (!b) return;
    if (e.type === 'input' && (el.type === 'checkbox' || el.tagName === 'SELECT')) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.t === 'num') { v = parseFloat(v); if (isNaN(v)) v = 0; }

      const [y, m] = inp.value.split('-').map(Number); if (!y) return;
      const n = new Date(Date.UTC(y, m, 0)).getUTCDate(), L = M.LANGS.en.p;
      let h = `<div style="font-weight:600;margin-bottom:8px">${esc(S.general.masjidName)} — ${new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 1)))} · ${esc(S.location.city)}</div><table class="tt"><tr><th>Date</th><th>Hijri</th>${M.PRAYERS.map((k) => `<th>${L[k]}</th>`).join('')}</tr>`;

        const p = { y, m, d }, day = M.computeDay(S, p), hj = M.hijri(p, +S.calc.hijriOffset || 0);
        const isT = y === now.y && m === now.m && d === now.d;
        h += `<tr class="${day.dow === 5 ? 'fri' : ''} ${isT ? 'td' : ''}"><td>${d} ${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'][day.dow]}</td><td>${hj.d}/${hj.m}</td>${M.PRAYERS.map((k) => `<td class="num">${M.fmtHM(day.times[k], S)}</td>`).join('')}</tr>`;

      try { const t0 = Date.now(); const j = await (await fetch(M.API + '/api/time', { cache: 'no-store' })).json(); const t1 = Date.now(); const server = j.now + (t1 - t0) / 2; S.clock.offsetMs = Math.round(t1 - server); S.clock.followServer = true; changed(); render(); toast('TV clock now follows this phone'); }
      catch (e) { toast('Could not reach server'); }

      const v = t.dataset.sec; let cur = Array.isArray(it.sections) ? it.sections.slice() : [];
      if (!v) cur = []; else cur = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v);

      S.sections.push({ id, name }); changed(); render(); toast('Section added — now assign TVs and content');

      const x = S.sections[+t.dataset.i]; if (!x || !confirm(`Delete section “${x.name}”? TVs in it will show content for all TVs.`)) return;

        const m = /[?&]link=(\d{6})/.exec(text) || /^\s*(\d{6})\s*$/.exec(text);

      }, (e) => toast(e.message));

    reloadPage() { location.reload(); },
    appServer() { if (M.inApp()) MeeqatApp.changeServer(); },

    },
    akAdd() { ensureAdhkar().push({ id: 'u' + Date.now(), ar: '', tr: '', ref: '', count: 1, on: true, prayers: { fajr: true, dhuhr: true, asr: true, maghrib: true, isha: true, jumuah: true } }); changed(); render(); setTimeout(() => scrollTo(0, document.body.scrollHeight), 50); },
    akDel(t) { if (!confirm('Delete this dhikr?')) return; ensureAdhkar().splice(+t.dataset.i, 1); changed(); render(); },
    akUp(t) { const l = ensureAdhkar(), i = +t.dataset.i; if (i > 0) { [l[i - 1], l[i]] = [l[i], l[i - 1]]; changed(); render(); } },
    akDown(t) { const l = ensureAdhkar(), i = +t.dataset.i; if (i < l.length - 1) { [l[i + 1], l[i]] = [l[i], l[i + 1]]; changed(); render(); } },
    akP(t) { const it = ensureAdhkar()[+t.dataset.i]; it.prayers = it.prayers || {}; it.prayers[t.dataset.k] = !it.prayers[t.dataset.k]; changed(); render(); },
    akReset() { if (!confirm('Replace your list with the standard adhkar list?')) return; S.adhkar.list = M.clone(M.STD_ADHKAR); changed(); render(); },
    akTest() { cmd('test-adhkar', { prayer: $('akTest').value }); },
    preview(t) {
      const id = get(t.dataset.p);
      if (previewAudio) { previewAudio.pause(); previewAudio = null; if (t.textContent === '■') { t.textContent = '▶'; return; } }
      if (!id) return toast('Built-in sound plays on the TV');
      previewAudio = new Audio(M.API + '/library/' + encodeURIComponent(id)); previewAudio.play().catch((e) => toast(e.message));
      document.querySelectorAll('[data-act=preview]').forEach((b) => (b.textContent = '▶')); t.textContent = '■';
      previewAudio.onended = () => { t.textContent = '▶'; };
    },
    iqOn() { S.features.iqamah = true; changed(); render(); },
    addAnn() { S.announcements = S.announcements || []; S.announcements.push({ id: 'a' + Date.now(), text: '', from: '', to: '', on: true }); changed(); render(); },
    delAnn(t) { S.announcements.splice(+t.dataset.i, 1); changed(); render(); },
    addAyah() { S.ayahs = S.ayahs || []; S.ayahs.push({ ar: '', tr: '', ref: '', on: true }); changed(); render(); },
    delAyah(t) { S.ayahs.splice(+t.dataset.i, 1); changed(); render(); },
    geo() {
      if (!navigator.geolocation) return toast('Location not available');
      if (!window.isSecureContext) return toast('Phone location needs https — pick a city or type coordinates');
      navigator.geolocation.getCurrentPosition((pos) => {
        S.location.lat = +pos.coords.latitude.toFixed(4); S.location.lng = +pos.coords.longitude.toFixed(4); S.location.preset = '';
        try { S.general.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || S.general.timezone; } catch (e) { /* */ }
        changed(); render(); toast('Location set — type the city name');
      }, (err) => toast(err.message), { enableHighAccuracy: false, timeout: 15000 });
    },
    upload(t) {
      const fi = $('fileIn'); fi.value = '';
      fi.onchange = async () => {
        const f = fi.files[0]; if (!f) return;
        if (f.size > 15 * 1048576) return toast('File too large (max 15 MB)');
        toast('Uploading…');
        try { const r = await store.upload(t.dataset.n, f); MEDIA = r.media; render(); toast('Uploaded'); } catch (e) { toast(e.message); }
      };
      fi.click();
    },
    async rmMedia(t) { if (!confirm('Remove this audio?')) return; try { await store.removeMedia(t.dataset.n); MEDIA[t.dataset.n] = null; render(); } catch (e) { toast(e.message); } },
    async pin() {
      const p = $('newPin').value.trim(); if (!/^\d{4,12}$/.test(p)) return toast('PIN must be 4–12 digits');
      try { await store.changePin(p); store.setPin(p); localStorage.setItem('miqat:pin:' + ID, p); pinIsDefault = false; $('newPin').value = ''; toast('PIN changed'); render(); } catch (e) { toast(e.message); }
    },
    logout() { try { localStorage.removeItem('miqat:pin:' + ID); localStorage.removeItem('miqat:screen'); } catch (e) { /* */ } ID = ''; $('lgPin').value = ''; showLogin(); },
    export() {
      M.saveText(`meeqat-${ID}-settings.json`, 'application/json', JSON.stringify({ app: 'miqat', version: M.VERSION, name: NAME, settings: S }, null, 2));
    },
    import() {
      const fi = $('jsonIn'); fi.value = '';
      fi.onchange = async () => {
        try { const j = JSON.parse(await fi.files[0].text()); S = M.withDefaults(j.settings || j); changed(); render(); toast('Settings imported'); }
        catch (e) { toast('Not a valid settings file'); }
      };
      fi.click();
    },
    reset() { if (!confirm('Reset all settings to defaults?')) return; S = M.withDefaults(null); changed(); render(); },
    async newScreen() {
      const name = $('nsName').value.trim() || 'New screen', pin = $('nsPin').value.trim();
      if (!/^\d{4,12}$/.test(pin)) return toast('PIN must be 4–12 digits');
      try {
        const seed = M.withDefaults(null); seed.general.masjidName = name;
        const r = await store.createScreen(name, pin, seed);
        const base = (await M.adminUrl(r.id)).replace(/\/admin\?.*$/, '');
        $('nsOut').innerHTML = `<div class="banner info" style="margin-top:12px">Created <b>${esc(name)}</b><br>Screen ID: <b>${esc(r.id)}</b><br>TV link: <span class="mono">${esc(base)}/?s=${esc(r.id)}</span><br>Phone link: <span class="mono">${esc(base)}/admin?s=${esc(r.id)}</span></div><div class="qrbox">${M.qrSvg(base + '/admin?s=' + r.id)}</div>`;
      } catch (e) { toast(e.message); }
    }
  };
  // quick pick city: fills lat/lng/tz/method
  document.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.actChange === 'preset') {
      const c = M.CITIES.find((x) => x[0] === e.target.value); if (!c) return;
      S.location.city = c[1].split(',')[0].replace(/\s*\(.*\)/, ''); S.location.lat = c[2]; S.location.lng = c[3]; S.general.timezone = c[4]; S.calc.method = c[5];
      changed(); render(); toast(`Set to ${c[1]} · ${c[5]} method`);
    }
  });

  /* ================= start ================= */
  // A TV pairing code from a scanned QR (admin.html?link=123456)
  let PENDING_LINK = (new URLSearchParams(location.search).get('link') || '').replace(/\D/g, '').slice(0, 6);
  if (PENDING_LINK) { try { history.replaceState(null, '', location.pathname + (ID ? '?s=' + ID : '')); } catch (e) { /* */ } }
  function openApp() {
    $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
    if (PENDING_LINK && MODE === 'server') {
      const code = PENDING_LINK; PENDING_LINK = '';
      setTimeout(() => {
        const secs = S.sections || [];
        const sh = document.createElement('div'); sh.className = 'sheet';
        sh.innerHTML = `<div><b style="font-size:18px">Link this TV?</b><p class="muted" style="margin:6px 0 14px">TV code <b>${esc(code)}</b> → ${esc(S.general.masjidName || NAME)}</p>
          ${secs.length ? `<label class="field" style="border:0;padding:0 0 10px"><span>Which section is this TV in?</span><select id="pkSec"><option value="">All sections</option>${secs.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>` : ''}
          <label class="field" style="border:0;padding:0 0 14px"><span>TV name (optional)</span><input type="text" id="pkName" maxlength="40" placeholder="e.g. Main hall TV"></label>
          <div class="grid2"><button class="btn" id="pkNo">Cancel</button><button class="btn pri" id="pkYes">📺 Link TV</button></div></div>`;
        document.body.appendChild(sh);
        $('pkNo').onclick = () => sh.remove();
        $('pkYes').onclick = async () => {
          try { await store.link(code, $('pkSec') ? $('pkSec').value : undefined, $('pkName').value.trim()); toast('TV linked ✓'); sh.remove(); setTimeout(loadTvs, 2500); }
          catch (e) { toast(e.message); }
        };
      }, 300);
    }
    if (MODE === 'server') setSync(viewers ? `Connected · ${viewers} screen${viewers > 1 ? 's' : ''} live` : 'Connected', 'ok');
    render();
  }
  M.autoUpdate({ every: 5 * 60000, canReload: () => !pending && !document.querySelector('.sheet') && !['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName) });
  (async function init() {
    if ((await M.probe()) === 'no') { MODE = 'local'; ID = ID || 'main'; store = M.createAdminStore(ID); offlineOpen(); return; }
    M.info().then((i) => { if (i.support) $('lgHelp').textContent = 'Forgot your PIN? Contact ' + i.support; });
    if (!M.inApp() && /Android/i.test(navigator.userAgent)) $('lgApp').innerHTML = '📱 <a href="admin-app" style="color:var(--acc)">Get the Meeqat Admin app</a> for Android';
    let saved = null; try { saved = ID && localStorage.getItem('miqat:pin:' + ID); } catch (e) { /* */ }
    if (M._probe !== 'yes') offerOffline();
    if (saved) { $('lgId').value = ID; await doLogin(saved, true); } else showLogin();
  })();
})();
</script>
</body>
</html>
