<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b1d">
<title>Meeqat · Super admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Outfit;font-weight:400;font-display:swap;src:url(fonts/outfit-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:500;font-display:swap;src:url(fonts/outfit-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:600;font-display:swap;src:url(fonts/outfit-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Malayalam';font-weight:400;font-display:swap;src:url(fonts/noto-sans-malayalam-malayalam-400-normal.woff2) format('woff2')}
@font-face{font-family:Amiri;font-weight:400;font-display:swap;src:url(fonts/amiri-arabic-400-normal.woff2) format('woff2')}
:root{--acc:#f3c96b;--ink:#1b1306;--bg:#070b1d;--line:rgba(255,255,255,.11);--mut:rgba(255,255,255,.62);--dim:rgba(255,255,255,.4);--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(90% 50% at 100% 0%,#24164f,transparent 60%),radial-gradient(80% 50% at 0% 100%,#0b3442,transparent 60%),var(--bg);background-attachment:fixed;color:#fff;font-family:Outfit,'Noto Sans Malayalam',Amiri,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px}
a{color:var(--acc);text-decoration:none}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
header .t{flex:1;min-width:200px}
header h1{margin:0;font-size:24px;font-weight:600}
header small{color:var(--mut)}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(243,201,107,.15)}
.logo svg{width:24px;height:24px;fill:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:11px;padding:8px 13px;font:inherit;font-weight:500;cursor:pointer;min-height:38px;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.btn.bad{color:#fecaca;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
.btn.ok{color:#bbf7d0;border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.12)}
.btn.xs{min-height:32px;padding:5px 10px;font-size:13px;border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
.stat{padding:16px}
.stat small{display:block;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.stat b{display:block;font-size:30px;font-weight:600;margin-top:4px}
.stat.g b{color:var(--ok)}.stat.y b{color:var(--warn)}.stat.r b{color:var(--bad)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:220px}
input,select{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:#fff;font:inherit;outline:none}
input:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{font-weight:600;font-size:15.5px}
td .s{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--dim)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em}
.b-m{background:rgba(124,200,255,.14);color:#bfe3ff}.b-h{background:rgba(243,201,107,.14);color:#fde7b0}
.b-p{background:rgba(251,191,36,.16);color:#fde68a}.b-d{background:rgba(248,113,113,.16);color:#fecaca}.b-a{background:rgba(74,222,128,.14);color:#bbf7d0}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:50px;text-align:center;color:var(--mut)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:380px;padding:28px}
.login h1{margin:14px 0 6px;font-size:26px}
.login p{color:var(--mut);margin:0 0 18px}
.login input{width:100%;margin-bottom:12px;font-size:16px;padding:13px}
.err{color:var(--bad);min-height:20px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.show{display:flex}
.modal .box{width:100%;max-width:420px;padding:24px;background:#10162e}
.modal h3{margin:0 0 6px}
.modal p{color:var(--mut);margin:0 0 14px}
.modal input{width:100%;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:11px 18px;border-radius:12px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.tablewrap{overflow-x:auto}
@media (max-width:1000px){.stats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:12px 4px;border-bottom:1px solid var(--line)}
  td{border:0;padding:5px 12px}
}
</style>
</head>
<body>

<section class="login" id="loginView">
  <div class="box glass">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5Z"/></svg></div>
    <h1>Super admin</h1>
    <p>All masjids and homes registered on this Meeqat server.</p>
    <input type="password" id="pw" placeholder="Super admin password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn pri" style="width:100%;min-height:46px" id="go">Log in</button>
  </div>
</section>

<section class="wrap hide" id="appView">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5Z"/></svg></div>
    <div class="t"><h1>Meeqat · Super admin</h1><small id="sub">Loading…</small></div>
    <button class="btn" id="refresh">↻ Refresh</button>
    <button class="btn" id="csv">⬇ Export CSV</button>
    <a class="btn" href="welcome.html" target="_blank">＋ Register new</a>
    <button class="btn" id="logout">Log out</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" placeholder="Search name, city, contact, mobile, screen ID…">
    <div class="chips" id="chips"></div>
  </div>
  <div class="glass tablewrap"><table>
    <thead><tr><th>Masjid / home</th><th>Contact</th><th>TV status</th><th>Registered</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table><div class="empty hide" id="empty">No screens match.</div></div>
</section>

<div class="modal" id="modal"><div class="box glass" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  const M = Miqat, $ = (i) => document.getElementById(i), esc = M.esc;
  let TOKEN = '', DATA = [], FILTER = 'all', NOW = Date.now();
  try { TOKEN = sessionStorage.getItem('meeqat:super') || ''; } catch (e) { /* */ }

  async function api(method, path, body) {
    const r = await fetch(M.API + path, { method, headers: { 'Content-Type': 'application/json', 'X-Super': TOKEN }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    let j = {}; try { j = await r.json(); } catch (e) { /* */ }
    if (r.status === 401 && path !== '/api/super/login') { logout(j.error); throw new Error(j.error); }
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  }
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400); }

  /* ---------- login ---------- */
  $('go').onclick = async () => {
    $('lerr').textContent = '';
    try {
      const j = await api('POST', '/api/super/login', { password: $('pw').value });
      TOKEN = j.token; try { sessionStorage.setItem('meeqat:super', TOKEN); } catch (e) { /* */ }
      $('pw').value = ''; show(); load();
    } catch (e) { $('lerr').textContent = e.message; }
  };
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
  function show() { $('loginView').classList.add('hide'); $('appView').classList.remove('hide'); }
  function logout(msg) { TOKEN = ''; try { sessionStorage.removeItem('meeqat:super'); } catch (e) { /* */ } $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); $('lerr').textContent = msg || ''; }
  $('logout').onclick = () => logout();

  /* ---------- data ---------- */
  async function load() {
    try {
      const j = await api('GET', '/api/super/screens');
      DATA = j.screens; NOW = j.now;
      $('sub').textContent = `${DATA.length} screens · registration: ${j.registration} · updated ${new Date().toLocaleTimeString()}`;
      render();
    } catch (e) { if (TOKEN) toast(e.message); }
  }
  $('refresh').onclick = load;
  setInterval(() => { if (TOKEN && !document.hidden && !$('modal').classList.contains('show')) load(); }, 30000);

  const isOnline = (x) => x.live > 0;
  const ago = (t) => {
    if (!t) return 'never';
    const s = Math.max(0, (NOW - t) / 1000);
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  };
  const fmtDate = (t) => (t ? new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
  const FILTERS = [['all', 'All'], ['masjid', 'Masjids'], ['home', 'Homes'], ['online', 'TV online'], ['offline', 'TV offline'], ['pending', 'Pending'], ['disabled', 'Disabled']];
  const match = (x, f) => f === 'all' || (f === 'masjid' && x.type !== 'home') || (f === 'home' && x.type === 'home') || (f === 'online' && isOnline(x)) || (f === 'offline' && !isOnline(x)) || (f === 'pending' && x.pending) || (f === 'disabled' && x.disabled);

  function render() {
    const week = NOW - 7 * 86400000;
    const st = [
      ['Total', DATA.length, ''], ['Masjids', DATA.filter((x) => x.type !== 'home').length, ''], ['Homes', DATA.filter((x) => x.type === 'home').length, ''],
      ['TV online now', DATA.filter(isOnline).length, 'g'], ['New this week', DATA.filter((x) => x.created > week).length, ''],
      ['Pending', DATA.filter((x) => x.pending).length, 'y'], ['Disabled', DATA.filter((x) => x.disabled).length, 'r']
    ];
    $('stats').innerHTML = st.map(([l, v, c]) => `<div class="stat glass ${c}"><small>${l}</small><b>${v}</b></div>`).join('');
    $('chips').innerHTML = FILTERS.map(([k, l]) => `<button class="chip ${FILTER === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('');
    const q = $('q').value.trim().toLowerCase();
    const list = DATA.filter((x) => match(x, FILTER) && (!q || [x.name, x.displayName, x.city, x.region, x.contact, x.mobile, x.email, x.id].join(' ').toLowerCase().includes(q)));
    $('empty').classList.toggle('hide', list.length > 0);
    $('rows').innerHTML = list.map((x) => {
      const mob = String(x.mobile || '').replace(/[^\d+]/g, '');
      const wa = mob ? 'https://wa.me/' + mob.replace(/^\+/, '') : '';
      const tv = location.origin + location.pathname.replace(/[^/]*$/, '') + '?s=' + encodeURIComponent(x.id);
      return `<tr>
        <td><b>${esc(x.displayName || x.name)}</b><span class="s">${esc(x.city || '—')}${x.region ? ' · ' + esc(x.region) : ''} · ${esc((M.LANGS[x.lang] || M.LANGS.en).name)}</span><span class="mono">${esc(x.id)}</span></td>
        <td>${esc(x.contact || '—')}<span class="s">${mob ? `<a href="tel:${esc(mob)}">${esc(x.mobile)}</a>${wa ? ` · <a href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}` : '—'}</span>${x.email ? `<span class="s"><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></span>` : ''}</td>
        <td><span class="live"><i class="dot ${isOnline(x) ? 'on' : ''}"></i>${isOnline(x) ? `${x.live} TV${x.live > 1 ? 's' : ''} live` : 'Offline'}</span><span class="s">Last seen ${ago(x.lastSeen)}</span></td>
        <td>${fmtDate(x.created)}<span class="s">Edited ${ago(x.updated)}</span></td>
        <td><span class="badge ${x.type === 'home' ? 'b-h' : 'b-m'}">${x.type === 'home' ? 'Home' : 'Masjid'}</span>
            ${x.disabled ? '<span class="badge b-d">Disabled</span>' : x.pending ? '<span class="badge b-p">Pending</span>' : '<span class="badge b-a">Active</span>'}
            ${x.pinIsDefault ? '<span class="s">default PIN</span>' : ''}</td>
        <td><div class="acts" style="justify-content:flex-end">
          <a class="btn xs" href="${esc(tv)}" target="_blank" rel="noopener">📺 View</a>
          ${x.pending ? `<button class="btn xs ok" data-a="approve" data-id="${esc(x.id)}">Approve</button>` : ''}
          ${x.disabled ? `<button class="btn xs ok" data-a="enable" data-id="${esc(x.id)}">Enable</button>` : `<button class="btn xs" data-a="disable" data-id="${esc(x.id)}">Disable</button>`}
          <button class="btn xs" data-a="pin" data-id="${esc(x.id)}">Reset PIN</button>
          <button class="btn xs bad" data-a="delete" data-id="${esc(x.id)}">Delete</button>
        </div></td></tr>`;
    }).join('');
  }
  $('q').addEventListener('input', render);
  document.addEventListener('click', async (e) => {
    const c = e.target.closest('[data-f]'); if (c) { FILTER = c.dataset.f; render(); return; }
    const b = e.target.closest('[data-a]'); if (!b) return;
    const x = DATA.find((d) => d.id === b.dataset.id); if (!x) return;
    const a = b.dataset.a;
    if (a === 'approve' || a === 'enable' || a === 'disable') {
      if (a === 'disable') return modal(`<h3>Disable “${esc(x.displayName)}”?</h3><p>Its TVs will show “screen disabled” and its phone control stops working. You can enable it again any time.</p><div class="acts"><button class="btn bad" data-m="ok">Disable</button><button class="btn" data-m="x">Cancel</button></div>`, () => act(x, 'disable'));
      return act(x, a);
    }
    if (a === 'pin') return modal(`<h3>Reset PIN</h3><p>New PIN for <b>${esc(x.displayName)}</b>. Tell the contact person (${esc(x.mobile || 'no mobile')}).</p><input id="mpin" inputmode="numeric" maxlength="12" placeholder="4–12 digits"><div class="acts"><button class="btn pri" data-m="ok">Set PIN</button><button class="btn" data-m="x">Cancel</button></div>`, async () => {
      const pin = $('mpin').value.trim(); if (!/^\d{4,12}$/.test(pin)) { toast('PIN must be 4–12 digits'); return false; }
      await act(x, 'resetPin', { pin });
    });
    if (a === 'delete') return modal(`<h3>Delete “${esc(x.displayName)}”?</h3><p>This permanently removes its settings and uploaded audio. Type <b>${esc(x.id)}</b> to confirm.</p><input id="mdel" autocomplete="off"><div class="acts"><button class="btn bad" data-m="ok">Delete forever</button><button class="btn" data-m="x">Cancel</button></div>`, async () => {
      if ($('mdel').value.trim() !== x.id) { toast('Type the screen ID exactly'); return false; }
      try { await api('DELETE', '/api/super/screens/' + x.id); toast('Deleted'); load(); } catch (err) { toast(err.message); }
    });
  });
  async function act(x, action, extra) {
    try { await api('POST', '/api/super/screens/' + x.id, Object.assign({ action }, extra || {})); toast({ approve: 'Approved', enable: 'Enabled', disable: 'Disabled', resetPin: 'PIN changed' }[action] || 'Done'); load(); }
    catch (e) { toast(e.message); }
  }
  function modal(html, onOk) {
    $('mbox').innerHTML = html; $('modal').classList.add('show');
    const inp = $('mbox').querySelector('input'); if (inp) setTimeout(() => inp.focus(), 50);
    $('mbox').onclick = async (e) => {
      const m = e.target.closest('[data-m]'); if (!m) return;
      if (m.dataset.m === 'ok') { const r = await onOk(); if (r === false) return; }
      $('modal').classList.remove('show');
    };
  }
  $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('modal').classList.remove('show'); });

  $('csv').onclick = () => {
    const cols = ['id', 'displayName', 'type', 'city', 'contact', 'mobile', 'email', 'created', 'lastSeen', 'live', 'pending', 'disabled', 'lang', 'lat', 'lng'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [cols.join(',')].concat(DATA.map((x) => cols.map((c) => q(c === 'created' || c === 'lastSeen' ? (x[c] ? new Date(x[c]).toISOString() : '') : x[c])).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\n')], { type: 'text/csv' }));
    a.download = `meeqat-screens-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  };

  if (TOKEN) { show(); load(); }
})();
</script>
</body>
</html>
