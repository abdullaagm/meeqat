plugins { id 'com.android.application' }

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
def server = System.getenv('MEEQAT_SERVER') ?: 'https://meeqat.winocle.com'

android {
    namespace 'com.winocle.meeqat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.winocle.meeqat'
        minSdk 21
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
        buildConfigField 'String', 'SERVER_URL', "\"${server}\""
    }
    buildFeatures { buildConfig true }

    // One project, three apps. They install side by side.
    flavorDimensions 'app'
    productFlavors {
        tv {
            dimension 'app'
            applicationIdSuffix '.tv'            // = com.winocle.meeqat.tv (same as the first release)
            resValue 'string', 'app_name', 'Meeqat TV'
            buildConfigField 'String', 'KIND', '"tv"'
            buildConfigField 'String', 'START_PATH', '"/tv?app=1"'
            buildConfigField 'boolean', 'LOCK', 'false'
        }
        admin {
            dimension 'app'
            applicationIdSuffix '.admin'
            resValue 'string', 'app_name', 'Meeqat Admin'
            buildConfigField 'String', 'KIND', '"admin"'
            buildConfigField 'String', 'START_PATH', '"/admin?app=1"'
            buildConfigField 'boolean', 'LOCK', 'false'
        }
        superadmin {
            dimension 'app'
            applicationIdSuffix '.superadmin'
            resValue 'string', 'app_name', 'Meeqat Super'
            buildConfigField 'String', 'KIND', '"super"'
            buildConfigField 'String', 'START_PATH', '"/super?app=1"'
            buildConfigField 'boolean', 'LOCK', 'true'
        }
    }
    sourceSets {
        admin {
            java.srcDirs += 'src/phone/java'
            manifest.srcFile 'src/phone/AndroidManifest.xml'
        }
        superadmin {
            java.srcDirs += 'src/phone/java'
            manifest.srcFile 'src/phone/AndroidManifest.xml'
        }
    }

    signingConfigs {
        release {
            // Fixed key so every new version installs over the old one.
            storeFile file('../meeqat-release.jks')
            storePassword System.getenv('MEEQAT_KEY_PASS') ?: 'meeqat-tv-2026'
            keyAlias 'meeqat'
            keyPassword System.getenv('MEEQAT_KEY_PASS') ?: 'meeqat-tv-2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
